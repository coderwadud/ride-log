name: Build Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RideLog-BD-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.10
          name: "RideLog BD Android App v1.0.10 (Black Screen Fix + Stale SW Cleanup)"
          body: "✅ নতুন ফিক্স ও সমাধান:\n- 📱 অ্যান্ড্রয়েড অ্যাপে পুরনো সার্ভিস ওয়ার্কার ক্যাশ ও স্ক্রিপ্ট হ্যাশ ব্লকিংয়ের কারণে কালো স্ক্রিন হওয়ার সমস্যা সমাধান করা হয়েছে\n- 🛡️ রিয়্যাক্ট এরর বাউন্ডারি (React Error Boundary) যোগ করা হয়েছে"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
