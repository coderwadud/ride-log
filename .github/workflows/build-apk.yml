name: Build Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Generate fixed debug.keystore & Log SHA-1
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore android/app/debug.keystore -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "=================================================="
          echo "=== SHA-1 FINGERPRINT OF YOUR APK KEYSTORE ==="
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -i "SHA1:"
          echo "=================================================="

      - name: Commit Keystore to Repo (if new)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f android/app/debug.keystore || true
          git commit -m "chore: persist fixed debug.keystore" || true
          git push origin main || true

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ride-Log-BD
          path: android/app/build/outputs/apk/debug/Ride-Log-BD.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "RideLog BD Android App v1.0.${{ github.run_number }}"
          body: |
            ### 🏍️ RideLog BD Official Android Release (v1.0.${{ github.run_number }})

            #### 🌟 Key Highlights & Feature Updates:
            - 🏷️ **Custom APK Package Name**: Download binary is directly named **`Ride-Log-BD.apk`** for convenient installation.
            - 🌐 **Default Language English**: Interface defaults to English out-of-the-box, with seamless 1-click toggle to Bengali (`ENG / বাংলা`).
            - 📱 **Offline-First Resilience**: Native Mobile App supports full offline data logging with automatic 2-way cloud synchronization upon network reconnect.
            - ☁️ **Web Live Cloud Database**: Web browser application fetches live data directly from Firebase Cloud Firestore.
            - 🖼️ **Google Profile Avatar Fix**: Smooth avatar image rendering in Android WebView using `referrerPolicy="no-referrer"`.
            - 🏍️ **Multi-Bike & Service Analytics**: Complete mileage tracking ($\text{Km/L}$), cost per km ($\text{৳/Km}$), engine oil health indicator, and JSON backup/restore.
          files: android/app/build/outputs/apk/debug/Ride-Log-BD.apk
          make_latest: true
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
