name: Build Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Generate fixed debug.keystore & Log SHA-1
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore android/app/debug.keystore -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "=================================================="
          echo "=== SHA-1 FINGERPRINT OF YOUR APK KEYSTORE ==="
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -i "SHA1:"
          echo "=================================================="

      - name: Commit Keystore to Repo (if new)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f android/app/debug.keystore || true
          git commit -m "chore: persist fixed debug.keystore" || true
          git push origin main || true

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RideLog-BD-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "RideLog BD Android App v1.0.${{ github.run_number }} (Offline-First Sync & Complete Import Fix)"
          body: "✅ অফলাইন-ফাস্ট লজিক ও প্রোফাইল ডাটা ইম্পোর্ট ফিক্স:\n- 📱 **Offline-First Resilience:** ইন্টারনেট কানেকশন না থাকলেও সিস্টেমে কোনো ডাটা খালি দেখাবে না। লোকাল মেমোরি থেকে সাথে সাথে ডাটা লোড হবে এবং অফলাইনে যুক্ত করা নতুন ফুয়েল/সার্ভিস রেকর্ড সমূহে ইন্টারনেট পাওয়ার সাথে সাথে ক্লাউডে ২-ওয়ে অটো সিঙ্ক হবে।\n- 📦 **Complete Backup Import Fix:** ব্যাকআপ ডাটা ইম্পোর্ট করার সময় সব বাইকের নাম, রেজিস্ট্রেশন নম্বর, ইনিশিয়াল ওডোমিটার, ওয়েল চেঞ্জ টার্গেট, ল্যাঙ্গুয়েজ এবং থিম সহ সমস্ত প্রোফাইল তথ্য এক ক্লিকে আপডেট হয়ে যাবে।"
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
