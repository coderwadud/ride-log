name: Build Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK Asset
        run: |
          mkdir -p android/app/build/outputs/apk/release/
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} android/app/build/outputs/apk/release/Ride-Log-BD.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RideLog-BD-Android-App
          path: android/app/build/outputs/apk/release/Ride-Log-BD.apk

      - name: Create GitHub Release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          TAG="v${APP_VERSION}"
          TITLE="RideLog BD v${APP_VERSION}"

          NOTES="### 🚀 RideLog BD v${APP_VERSION} Release

          **Latest Features & Improvements:**
          - Dedicated full-page Support & Ticket Details system
          - Date & Date Range filtering with quick presets
          - Search, sorting (Highest & Lowest cost), and pagination
          - Modular Firestore Sub-collections with zero-data-loss auto-migration
          - Modernized UI with SVG icons & bilingual support

          Commit: ${{ github.sha }}"

          # Delete existing tag/release if it exists to allow clean overwrite
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true

          # Retry up to 3 times in case of temporary network glitches
          for i in 1 2 3; do
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              android/app/build/outputs/apk/release/Ride-Log-BD.apk && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done

