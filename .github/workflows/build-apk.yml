name: Build Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RideLog-BD-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.14
          name: "RideLog BD Android App v1.0.14 (Google Drive Sync + Multi-Bike Support)"
          body: "✅ নতুন ফিচার ও আপডেট:\n- ☁️ **Google Drive Offline-First Sync:** ইন্টারনেট নেটওয়ার্ক না থাকলেও সমস্ত ডাটা অফলাইনে লোকালি সেভ হবে এবং নেটে কানেক্ট হওয়ার সাথে সাথে নিজের গুগল ড্রাইভে অটো সিঙ্ক হবে।\n- 🏍️ **মাল্টিপল বাইক কার্ড সাপোর্ট:** একাধিক বাইক যুক্ত করা, এডিট করা ও প্রতি বাইকের আলাদা আলাদা ফুয়েল ও সার্ভিস রেকর্ড ট্র্যাক করার সুবিধা।"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
