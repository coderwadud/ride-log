name: Build Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RideLog-BD-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.16
          name: "RideLog BD Android App v1.0.16 (Redesigned Bike Chips Bar + Header Clean UI)"
          body: "✅ নতুন ডিজাইন ও আপডেট:\n- 🏍️ **Redesigned Bike Selection Bar:** হেডার থেকে ড্রপডাউন সরিয়ে হেডারের নিচে একটি অত্যন্ত সুন্দর ও রেসপনসিভ **বাইক সিলেক্টর চিপস বার** যুক্ত করা হয়েছে।\n- 📱 **Clean Header Layout:** হেডার থেকে অ্যান্ড্রয়েড ইনস্টল বাটনটি সরিয়ে ক্লাউড সিঙ্ক, ল্যাঙ্গুয়েজ এবং সেটিংস অপশনগুলোকে ফ্রেশ ও ক্লিন লুক দেওয়া হয়েছে।"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
