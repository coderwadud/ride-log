name: Build Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK Asset
        run: |
          mkdir -p android/app/build/outputs/apk/release/
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} android/app/build/outputs/apk/release/Ride-Log-BD.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RideLog-BD-Android-App
          path: android/app/build/outputs/apk/release/Ride-Log-BD.apk

      - name: Create GitHub Release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.1.${{ github.run_number }}
        run: |
          NOTES="RideLog BD v1.1 (Build #${{ github.run_number }})

          Updates:
          - IndexedDB file storage fix
          - PDF viewer for Android
          - Language sync fix
          - Firebase Analytics (DAU/MAU)
          - Account permanent delete feature

          Commit: ${{ github.sha }}"

          # Delete existing tag/release if it exists
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true

          # Retry up to 3 times in case of GitHub 503
          for i in 1 2 3; do
            gh release create "$TAG" \
              --title "RideLog BD v1.1 (Build #${{ github.run_number }})" \
              --notes "$NOTES" \
              --latest \
              android/app/build/outputs/apk/release/Ride-Log-BD.apk && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done

