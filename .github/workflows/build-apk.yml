name: Build Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RideLog-BD-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.15
          name: "RideLog BD Android App v1.0.15 (Native Google Account Chooser Auth Screen)"
          body: "✅ নতুন ফিচার ও আপডেট:\n- 🔑 **Google Auth Account Chooser Screen:** গুগল ড্রাইভে সিঙ্ক করার সময় ম্যানুয়াল টেক্সট ইনপুট পপ-আপের পরিবর্তে এখন সরাসরি স্ট্যান্ডার্ড গুগল সাইন-ইন স্ক্রিন (Account Chooser Popup) ওপেন হবে, যা থেকে ব্যবহারকারী ১-ক্লিকে তার জি-মেইল অ্যাকাউন্ট বেছে নিয়ে ক্লাউড সিঙ্ক করতে পারবেন।"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
