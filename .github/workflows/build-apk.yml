name: Build Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK Asset
        run: |
          mkdir -p android/app/build/outputs/apk/release/
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} android/app/build/outputs/apk/release/Ride-Log-BD.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RideLog-BD-Android-App
          path: android/app/build/outputs/apk/release/Ride-Log-BD.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}-${{ github.run_attempt }}
          name: "RideLog BD v1.1 (Build #${{ github.run_number }})"
          body: |
            ## 🚀 RideLog BD v1.1 — Latest Signed Release APK

            ### ✅ এই বিল্ডে যা যা আপডেট হয়েছে:
            - 🗄️ **IndexedDB ফাইল স্টোরেজ** — ফাইল আপলোড কোটা বাগ সম্পূর্ণ ঠিক
            - 📄 **PDF ভিউয়ার** — Android-এ PDF নেটিভ রিডারে খোলার সাপোর্ট
            - 🌐 **ভাষা সিঙ্ক** — লোডিং স্ক্রিন ইউজারের সিলেক্ট করা ভাষায় দেখাবে
            - 📊 **Firebase Analytics** — DAU/MAU ট্র্যাকিং ও কাস্টম ইভেন্ট
            - 🗑️ **Account Delete** — ২ ধাপের নিশ্চিতকরণ সহ স্থায়ী একাউন্ট ডিলিট

            **Build:** #${{ github.run_number }} | **Commit:** ${{ github.sha }}
          files: android/app/build/outputs/apk/release/Ride-Log-BD.apk
          make_latest: true
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
